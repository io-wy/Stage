<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage 治理控制台</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%23191c18"/><path d="M8 10h16v3H8zm0 6h12v3H8zm0 6h16v3H8z" fill="%23dff3ef"/></svg>' />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="brand">Stage <span>Governance</span></div>
        <div class="subtitle">服务治理运行台</div>
      </div>
      <div class="top-actions">
        <div class="mode-chip">治理链路</div>
        <div id="health" class="health">连接中</div>
      </div>
    </header>

    <main class="shell">
      <aside class="controls" aria-label="运行控制">
        <section class="panel control-panel">
          <div class="section-head compact">
            <h2>服务请求</h2>
            <span>线上入口</span>
          </div>
          <label for="serviceRequest">用户请求</label>
          <textarea id="serviceRequest" rows="6">我想知道 NAS 有哪些安全访问方式，需要注意不要泄露旧共享账号或内部密钥。</textarea>
          <button id="runCaseButton" class="primary-action" type="button">
            提交治理请求
          </button>
        </section>
      </aside>

      <section class="workspace" aria-label="治理结果">
        <section class="panel workflow-panel view active" data-view-panel="run pipeline">
          <div class="section-head">
            <h2>企业服务治理流</h2>
            <span id="activeCase">企业服务治理模板</span>
          </div>
          <div class="workflow-shell">
            <div class="workflow-main">
              <div class="workflow-legend" aria-label="节点状态说明">
                <span><i class="state-dot info"></i>已识别</span>
                <span><i class="state-dot ok"></i>通过</span>
                <span><i class="state-dot warn"></i>需处理</span>
                <span><i class="state-dot danger"></i>阻断</span>
              </div>
              <div id="timeline" class="workflow-canvas" aria-label="交付阶段"></div>
            </div>
            <aside class="node-inspector" aria-label="节点详情">
              <div class="inspector-head">
                <span>节点详情</span>
                <strong id="selectedNodeTitle">等待运行</strong>
              </div>
              <div id="selectedNodeSummary" class="inspector-summary">提交请求后查看状态流转</div>
              <pre id="nodeDetails" class="details"></pre>
            </aside>
          </div>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
